<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">SmartStick signal wiring: GPIO13 trigger, protected GPIO12 echo, GPIO14/15 I2C, GPIO2 driver and GPIO3 button</title><rect width="1200" height="600" rx="24" fill="#081a2c"/><g font-family="Arial,sans-serif" fill="#edf9fa"><text x="30" y="45" font-size="27" font-weight="bold">Confirmed signal connections</text><text x="30" y="77" font-size="17" fill="#9fc8d0">GPIO numbers, not connector positions. Follow the complete hardware guide before applying power.</text></g><g fill="#123247" stroke="#398f96" stroke-width="2"><rect x="450" y="125" width="280" height="360" rx="18"/><rect x="30" y="140" width="210" height="130" rx="18"/><rect x="30" y="335" width="220" height="75" rx="18"/><rect x="30" y="440" width="220" height="75" rx="18"/><rect x="900" y="150" width="270" height="175" rx="18"/><rect x="900" y="390" width="270" height="110" rx="18"/></g><g font-family="Arial,sans-serif" fill="#edf9fa"><text x="485" y="168" font-size="26" font-weight="bold">ESP32-CAM</text><text x="485" y="201" font-size="17">AI-Thinker / OV2640</text><text x="485" y="265" font-size="20">13  TRIG</text><text x="485" y="310" font-size="20">12  ECHO</text><text x="485" y="363" font-size="20">14  SDA</text><text x="485" y="397" font-size="20">15  SCL</text><text x="485" y="450" font-size="17">Shared GND</text><text x="50" y="181" font-size="23" font-weight="bold">HC-SR04</text><text x="50" y="216" font-size="17">TRIG / ECHO</text><text x="50" y="249" font-size="16">Verified 5 V supply</text><text x="50" y="367" font-size="22" font-weight="bold">MPU6050</text><text x="50" y="395" font-size="17">I2C 0x68</text><text x="50" y="472" font-size="22" font-weight="bold">INA219</text><text x="50" y="501" font-size="17">I2C 0x40 · verify shunt</text><text x="920" y="188" font-size="23" font-weight="bold">Coin vibration motor</text><text x="920" y="222" font-size="17">NPN low-side driver</text><text x="920" y="257" font-size="16" fill="#ffcf81">Add/verify base resistor,</text><text x="920" y="281" font-size="16" fill="#ffcf81">pull-down + flyback diode</text><text x="920" y="307" font-size="15">Motor supply rating unknown</text><text x="920" y="431" font-size="23" font-weight="bold">Momentary button</text><text x="920" y="468" font-size="17">GPIO3 ↔ button ↔ GND</text></g><g stroke="#40d6bd" stroke-width="3" fill="none"><path d="M240 185H315V257H450M240 230H280V302H450M250 370H330V378H450M250 478H330V378M730 250H900M730 435H900"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#86dfce"><text x="260" y="168">TRIG →</text><text x="288" y="286" fill="#ffcf81">ECHO level protection</text><text x="286" y="330" fill="#ffcf81">5 V → 3.3 V logic</text><text x="272" y="360">Two-wire I2C</text><text x="272" y="428">3.3 V logic pull-ups</text><text x="755" y="232">GPIO2 → driver</text><text x="750" y="418">GPIO3 pull-up</text></g><g font-family="Arial,sans-serif"><text x="30" y="553" font-size="18" fill="#ffcf81">Power: 2500 mAh Li-ion + generic power-bank module; exact charger/boost connections unconfirmed.</text><text x="30" y="582" font-size="16" fill="#9fc8d0">GPIO12/2/15 are boot straps; GPIO3 shares serial RX. Signal overview only, not a complete power or PCB schematic.</text></g></svg>
